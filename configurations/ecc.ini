[software:ecc]
base_path = ~/.claude
setup-commands =
    mkdir -p {base_path}/rules/ecc

[file:ecc-contexts]
source_filename = claude/ecc/contexts
target_filename = contexts
no_dot = true

[file:ecc-rules-common]
source_filename = claude/ecc/rules/common
target_filename = rules/ecc/common
no_dot = true

[file:ecc-rules-python]
source_filename = claude/ecc/rules/python
target_filename = rules/ecc/python
no_dot = true

[file:ecc-rules-react]
source_filename = claude/ecc/rules/react
target_filename = rules/ecc/react
no_dot = true

[file:ecc-rules-typescript]
source_filename = claude/ecc/rules/typescript
target_filename = rules/ecc/typescript
no_dot = true

[file:ecc-rules-golang]
source_filename = claude/ecc/rules/golang
target_filename = rules/ecc/golang
no_dot = true
