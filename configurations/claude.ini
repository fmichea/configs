[software:claude]
base_path = ~/.claude
setup-commands =
    mkdir -p {base_path}/hooks

[file:claude-settings]
source_filename = claude/settings.json
target_filename = settings.json
no_dot = true

[file:claude-instructions]
source_filename = claude/CLAUDE.md
target_filename = CLAUDE.md
no_dot = true

[file:claude-hook-secret-output-scan]
source_filename = claude/hooks/secret-output-scan.sh
target_filename = hooks/secret-output-scan.sh
no_dot = true
