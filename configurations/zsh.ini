[software:zsh]
setup-commands =
    git submodule --quiet init {root}/files/zsh/bundle/*
    git submodule --quiet update {root}/files/zsh/bundle/*
teardown-commands =
    git submodule --quiet deinit {root}/files/zsh/bundle/*

[file:zshrc]
filename = zshrc

[file:zsh]
filename = zsh

[file:p10k.zsh]
filename = p10k.zsh
