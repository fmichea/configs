# tmux.conf

#########################
# General configuration.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"   # Outer terminal supports true colour.
set -g base-index 1
set -g renumber-windows on
set -s escape-time 0
set -s focus-events on                    # Let vim reload files changed outside.
set -s set-clipboard on                   # Copy to the local clipboard over SSH (OSC 52).
set -g history-limit 50000
set -g mouse on
set -g status-left-length 40

#################
# Key Bindings.
set -g prefix C-a
bind-key C-a send-prefix

bind-key a last-window
bind-key r source-file ~/.tmux.conf

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key m set-window-option monitor-activity on
bind-key C-m set-window-option monitor-activity off

# vim: filetype=tmux
